<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abastece Juquitiba</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans antialiased">
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            const [postos, setPostos] = React.useState([]);
            const [modoMille, setModoMille] = React.useState(true);
            const [atualizacao, setAtualizacao] = React.useState('');

            React.useEffect(() => {
                fetch(`https://raw.githubusercontent.com/vallarus-true/Combustiveis/main/precos_juquitiba.json?t=${Date.now()}`)
                    .then(r => r.json())
                    .then(d => {
                        setPostos(d.postos);
                        setAtualizacao(d.ultima_atualizacao);
                    }).catch(console.error);
            }, []);

            const processados = postos.map(p => {
                const fator = modoMille ? 0.71 : 0.70;
                const tetoEtanol = p.gasolina * fator;
                const etanolVence = p.etanol <= tetoEtanol;
                const custoKmGasolina = p.gasolina / 12.4;
                const custoKmEtanol = p.etanol / 8.8;
                const menorCustoKm = modoMille ? Math.min(custoKmGasolina, custoKmEtanol) : 0;
                const dist = p.distancia_km !== undefined ? p.distancia_km : 999;
                return { ...p, tetoEtanol, etanolVence, menorCustoKm, custoKmGasolina, custoKmEtanol, dist };
            });

            if (processados.length === 0) return (
                <div className="flex justify-center items-center min-h-screen bg-gray-950 text-gray-400">
                    <p className="animate-pulse">Carregando inteligência da rota...</p>
                </div>
            );

            const campeao = [...processados].sort((a, b) => a.menorCustoKm - b.menorCustoKm)[0];
            const listaPorDistancia = [...processados].sort((a, b) => a.dist - b.dist);

            return (
                <div className="max-w-md mx-auto bg-gray-900 min-h-screen pb-12 shadow-2xl border-x border-gray-800">
                    <div className="bg-gradient-to-r from-indigo-900 to-slate-900 text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-20 border-b border-indigo-700/40">
                        <div>
                            <h1 className="text-xl font-black tracking-tight">⛽ Abastece Juquitiba</h1>
                            <p className="text-[10px] text-indigo-200 uppercase tracking-widest">Corredor Régis / Rodoanel / SP</p>
                        </div>
                        <span className="text-xs bg-indigo-800/80 text-indigo-200 px-2.5 py-1 rounded-full font-semibold border border-indigo-600/50">PWA Ativo</span>
                    </div>
                    
                    <div className="p-4 space-y-4">
                        <div className="bg-gray-800/90 p-4 rounded-xl border border-gray-700/80 flex justify-between items-center shadow-md">
                            <div>
                                <h3 className="font-bold text-gray-100 text-sm">Perfil do Veículo</h3>
                                <p className="text-xs text-indigo-400 mt-0.5">Modo Uno Mille 2008 (Paridade 71%)</p>
                            </div>
                            <label className="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" checked={modoMille} onChange={e => setModoMille(e.target.checked)} className="sr-only peer" />
                                <div className="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
                            </label>
                        </div>

                        {campeao && modoMille && (
                            <div className="bg-gradient-to-br from-emerald-600 to-emerald-800 rounded-2xl p-5 shadow-xl border border-emerald-500/50 relative overflow-hidden">
                                <div className="absolute top-0 right-0 bg-emerald-900/60 text-emerald-200 text-[9px] font-extrabold uppercase px-3 py-1 rounded-bl-xl tracking-wider border-l border-b border-emerald-500/30">
                                    🔥 Melhor Custo-Benefício
                                </div>
                                <p className="text-emerald-100 text-[10px] font-bold uppercase tracking-widest mb-1">Recomendação do Momento</p>
                                <h2 className="text-2xl font-black text-white mb-2 tracking-tight">
                                    Vá de {campeao.etanolVence ? 'Etanol' : 'Gasolina'}!
                                </h2>
                                <div className="text-sm font-semibold text-white mb-1">
                                    {campeao.nome}
                                </div>
                                <div className="text-xs text-emerald-100/90 mb-3 flex items-center gap-1">
                                    <span>📍 {campeao.cidade}</span>
                                    <span>•</span>
                                    <span>{campeao.dist === 0 ? 'Marco Zero' : `${campeao.dist} km de Juquitiba`}</span>
                                </div>
                                <div className="bg-emerald-950/40 rounded-xl p-3 border border-emerald-400/30 flex justify-between items-center">
                                    <div>
                                        <div className="text-[10px] text-emerald-200 uppercase font-bold">Custo Estimado</div>
                                        <div className="text-base font-black text-white">R$ {campeao.menorCustoKm.toFixed(3)} <span className="text-xs font-normal text-emerald-200">/ KM</span></div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-[10px] text-emerald-200 uppercase font-bold">Preço Bomba</div>
                                        <div className="text-base font-black text-white">R$ {campeao.etanolVence ? campeao.etanol.toFixed(2) : campeao.gasolina.toFixed(2)}</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="pt-2 pb-1 border-b border-gray-800 flex justify-between items-center">
                            <h3 className="font-bold text-gray-300 text-xs uppercase tracking-wider">Lista Completa por Proximidade</h3>
                            <span className="text-[10px] text-gray-500">Juquitiba → SP / Itanhaém</span>
                        </div>

                        {listaPorDistancia.map((p, i) => (
                            <div key={i} className={`bg-gray-800/80 backdrop-blur rounded-xl p-4 border transition shadow-sm relative ${p.nome === campeao.nome ? 'border-emerald-500/60 bg-gray-800' : 'border-gray-700/70'}`}>
                                <div className="flex justify-between items-start mb-2">
                                    <div>
                                        <h4 className="font-bold text-gray-100 text-base">{p.nome}</h4>
                                        <p className="text-xs text-indigo-300 font-medium">{p.cidade}</p>
                                    </div>
                                    <div className="text-right">
                                        <span className="text-xs font-bold bg-gray-900 px-2 py-1 rounded text-gray-300 border border-gray-700">
                                            {p.dist === 0 ? '0 km' : `${p.dist} km`}
                                        </span>
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-2.5 my-3">
                                    <div className="bg-gray-900/70 p-2.5 rounded-lg border border-gray-700/50">
                                        <div className="text-[10px] text-gray-400 uppercase tracking-wider font-semibold">Gasolina</div>
                                        <div className="font-black text-base text-gray-100">R$ {p.gasolina.toFixed(2)}</div>
                                        <div className="text-[10px] text-gray-500 mt-0.5">R$ {p.custoKmGasolina.toFixed(3)}/km</div>
                                    </div>
                                    <div className="bg-gray-900/70 p-2.5 rounded-lg border border-gray-700/50">
                                        <div className="text-[10px] text-gray-400 uppercase tracking-wider font-semibold">Etanol</div>
                                        <div className="font-black text-base text-gray-100">R$ {p.etanol.toFixed(2)}</div>
                                        <div className="text-[10px] text-gray-500 mt-0.5">R$ {p.custoKmEtanol.toFixed(3)}/km</div>
                                    </div>
                                </div>

                                {modoMille && (
                                    <div className={`p-2.5 rounded-lg text-xs font-medium border ${p.etanolVence ? 'bg-emerald-950/40 text-emerald-400 border-emerald-800/50' : 'bg-gray-900/40 text-gray-300 border-gray-700/60'}`}>
                                        <div className="flex justify-between items-center">
                                            <span>Vantagem: <strong className={p.etanolVence ? 'text-emerald-300 font-bold' : 'text-white font-bold'}>{p.etanolVence ? 'ETANOL' : 'GASOLINA'}</strong></span>
                                            <span className="text-[11px] text-gray-400">Teto: R$ {p.tetoEtanol.toFixed(2)}</span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                        
                        <div className="text-center pt-4 border-t border-gray-800/80">
                            <p className="text-[10px] text-gray-500">Última atualização do robô: {atualizacao}</p>
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
