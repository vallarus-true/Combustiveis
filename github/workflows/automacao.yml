name: Robô Diário de Preços

on:
schedule:
- cron: '0 11 * * *'
workflow_dispatch:

jobs:
raspar-dados:
runs-on: ubuntu-latest
permissions:
contents: write

steps:
  - name: Pegar os arquivos do projeto
    uses: actions/checkout@v4

  - name: Instalar o Python no computador virtual
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Instalar ferramentas do robô
    run: |
      python -m pip install --upgrade pip
      pip install requests beautifulsoup4

  - name: Ligar o Robô (Executar o Script)
    run: python robo_raspador.py

  - name: Salvar o novo preço e publicar a atualização
    run: |
      git config --local user.email "robo@abastecejuquitiba.com"
      git config --local user.name "Robô de Preços"
      git add precos_juquitiba.json
      git diff --quiet && git diff --staged --quiet || git commit -m "Atualização diária de preços [Automático]"
      git push
